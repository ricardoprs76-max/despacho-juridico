name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  n8n-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/n8n/node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose refuses to start without AGENTES_API_KEY
        run: |
          if AGENTES_API_KEY= docker compose config > /dev/null 2> err.txt; then
            echo "compose accepted an empty AGENTES_API_KEY"; exit 1
          fi
          grep AGENTES_API_KEY err.txt
      - name: compose is valid with a key
        run: docker compose config > /dev/null
        env:
          AGENTES_API_KEY: ci-key
      - name: build both images
        run: docker compose build
        env:
          AGENTES_API_KEY: ci-key
      - name: agent container becomes healthy
        env:
          AGENTES_API_KEY: ci-key
        run: |
          docker compose up -d --wait agente
          curl -fsS -H "X-API-Key: ci-key" http://localhost:8000/health
          docker compose down
