[project]
name = "agentes-ia-empresas"
version = "0.1.0"
description = "Configurable AI agents for small businesses: one YAML file per company, LangGraph inside."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ricardo Porras", email = "ricardoprs76@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=2.1",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
    "pypdf>=6.21.4",
    "langchain-text-splitters>=1.1.3",
    "gspread>=6.2.1",
    "google-auth>=2.62.0",
]

[project.scripts]
agentes = "agentes.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
